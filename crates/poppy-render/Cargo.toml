[package]
name = "poppy-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-copy GPU interop bridges (DMA-BUF to Vulkan/OpenGL) for Project Poppy"

[dependencies]
poppy-core = { workspace = true }
poppy-hw = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }
libc = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu-hal = { workspace = true, features = ["vulkan"] }
ash = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu-hal = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = { workspace = true, features = ["metal"] }

[dev-dependencies]
poppy-demux = { workspace = true }
