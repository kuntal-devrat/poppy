[workspace]
resolver = "2"
members = [
    "crates/poppy-core",
    "crates/poppy-demux",
    "crates/poppy-h264",
    "crates/poppy-hevc",
    "crates/poppy-av1",
    "crates/poppy-hw",
    "crates/poppy-render",
    "crates/poppy",
    "bins/poppy-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuntal-devrat/poppy"
description = "Crisp, memory-safe video demuxing with zero-copy hardware decode"

[workspace.dependencies]
# Internal crates
poppy-core = { path = "crates/poppy-core" }
poppy-demux = { path = "crates/poppy-demux" }
poppy-h264 = { path = "crates/poppy-h264" }
poppy-hevc = { path = "crates/poppy-hevc" }
poppy-av1 = { path = "crates/poppy-av1" }
poppy-hw = { path = "crates/poppy-hw" }
poppy-render = { path = "crates/poppy-render" }
poppy = { path = "crates/poppy" }

# Shared external dependencies
bytes = "1"
thiserror = "2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
wgpu = "24"
wgpu-hal = "24"
ash = "0.38"
pollster = "1.0"
bytemuck = { version = "1", features = ["derive"] }
winit = "0.30"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
proptest = "1.6"
