[package]
name = "poppy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
poppy-core = { path = "../crates/poppy-core" }
poppy-demux = { path = "../crates/poppy-demux" }
poppy-h264 = { path = "../crates/poppy-h264" }
poppy-hevc = { path = "../crates/poppy-hevc" }
poppy-av1 = { path = "../crates/poppy-av1" }
bytes = "1"

[[bin]]
name = "fuzz_isobmff"
path = "fuzz_targets/fuzz_isobmff.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ebml"
path = "fuzz_targets/fuzz_ebml.rs"
test = false
doc = false

[[bin]]
name = "fuzz_h264_parse"
path = "fuzz_targets/fuzz_h264_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hevc_parse"
path = "fuzz_targets/fuzz_hevc_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_av1_parse"
path = "fuzz_targets/fuzz_av1_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_bsf"
path = "fuzz_targets/fuzz_bsf.rs"
test = false
doc = false
