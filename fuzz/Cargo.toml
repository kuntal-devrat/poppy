[package]
name = "poppy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
poppy-demux = { path = "../crates/poppy-demux" }
poppy-h264 = { path = "../crates/poppy-h264" }
poppy-core = { path = "../crates/poppy-core" }
bytes = "1"

[[bin]]
name = "fuzz_isobmff"
path = "fuzz_targets/fuzz_isobmff.rs"
test = false
doc = false

[[bin]]
name = "fuzz_h264_parse"
path = "fuzz_targets/fuzz_h264_parse.rs"
test = false
doc = false
