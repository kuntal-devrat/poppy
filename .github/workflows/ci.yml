name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 4 * * 1' # weekly fuzz/audit

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libdrm-dev

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Test (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libdrm-dev mesa-va-drivers vainfo

      - name: Run Test Suite
        run: cargo test --workspace -- --test-threads=1

      - name: Fuzz smoke (60s per target, panic-only)
        run: |
          cargo install cargo-fuzz --locked || true
          for t in fuzz_isobmff fuzz_ebml fuzz_h264_parse fuzz_hevc_parse fuzz_av1_parse fuzz_bsf; do
            timeout 70 cargo fuzz run $t -- -max_total_time=60 -max_len=4096 || exit 1
          done
        working-directory: fuzz

      - name: Security audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --deny warnings || true

  test-crossplatform:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        run: cargo test --workspace -- --test-threads=1
